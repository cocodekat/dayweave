<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Philip & Midas — German dialogue trainer</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f3f6fb}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px}.app{width:min(820px,100%);margin:auto}
    header{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:10px 0 22px}h1{margin:0;font-size:clamp(1.7rem,5vw,2.7rem);letter-spacing:-.045em}.sub{color:#5b667a;margin:.35rem 0 0}.back{display:inline-flex;align-items:center;gap:8px;padding:11px 14px;border:1px solid #d9e0eb;border-radius:13px;color:#33415d;background:#fff;text-decoration:none;font-weight:800;white-space:nowrap}.back:hover{background:#e9eef7}
    .card{background:#fff;border:1px solid #dce3ef;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 18px 55px #18294b16}
    .setup{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{border:2px solid #dce3ef;background:#fff;color:#172033;padding:18px;border-radius:16px;font-size:1rem;font-weight:800;cursor:pointer}.choice.active{border-color:#3157d5;background:#edf2ff;color:#173aaf}
    label{display:block;font-weight:800;margin:24px 0 10px}.mode{display:flex;gap:10px;flex-wrap:wrap}.mode button{background:#e9eef7;color:#33415d}.mode button.active{background:#172033;color:#fff}
    button{border:0;border-radius:13px;padding:13px 17px;font:inherit;font-weight:800;cursor:pointer;min-height:48px}.primary{background:#3157d5;color:#fff}.secondary{background:#e9eef7;color:#24314b}.quiet{background:transparent;color:#4b5870;border:1px solid #d9e0eb}
    button:focus-visible,textarea:focus-visible{outline:4px solid #9bb2ff;outline-offset:2px}.start{width:100%;margin-top:26px}
    .topline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}.pill{background:#edf2ff;color:#2748b6;padding:7px 12px;border-radius:999px;font-weight:850}.score{color:#5b667a;font-weight:750}
    .cue-label,.your-label{font-size:.82rem;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:#68758c}.cue{font-size:clamp(1.25rem,3.7vw,1.8rem);line-height:1.4;margin:10px 0 26px;padding-left:18px;border-left:4px solid #f0bd36}
    textarea{width:100%;min-height:104px;border:2px solid #d8e0ec;border-radius:15px;padding:15px;font:inherit;font-size:1.08rem;line-height:1.45;resize:vertical;margin-top:9px}.hint{color:#667289;margin:10px 0 0;line-height:1.5}.answer{display:none;margin:18px 0 0;padding:17px;border-radius:15px;background:#eefbf4;border:1px solid #bfe8d0;color:#145333;font-size:1.08rem;line-height:1.5}.answer.show{display:block}.feedback{min-height:28px;font-weight:800;margin:13px 0 0}.good{color:#16814b}.close{color:#a35c00}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.actions button{flex:1}.footer-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.done{text-align:center}.done h2{font-size:2rem;margin:10px 0}.done p{color:#5b667a;line-height:1.55}.hidden{display:none}
    @media(max-width:560px){body{padding:14px}.setup{grid-template-columns:1fr}.actions button{flex-basis:100%}.topline{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="app">
  <header><div><h1>German dialogue trainer</h1><p class="sub">Learn the cue, not just the order.</p></div><a class="back" href="/german/">← German</a></header>
  <section class="card" id="screen"></section>
</main>
<script>
const dialogue=[
['Philip','Hallo! Wie heißt du?'],['Midas','Ich heiße Midas. Wie heißt du?'],['Philip','Ich heiße Philip. Wie alt bist du?'],['Midas','Ich bin dreizehn Jahre alt. Wie alt bist du?'],['Philip','Ich bin auch dreizehn Jahre alt. Wo wohnst du?'],['Midas','Ich wohne in Amersfoort. Wo wohnst du?'],['Philip','Ich wohne auch in Amersfoort. Was machst du gern in deiner Freizeit?'],['Midas','Ich spiele gern Fußball. Was machst du gern in deiner Freizeit?'],['Philip','Ich spiele gern Computerspiele. Warum spielst du gern Fußball?'],['Midas','Weil Fußball Spaß macht. Warum spielst du gern Computerspiele?'],['Philip','Weil Computerspiele interessant sind. Wann spielst du Fußball?'],['Midas','Ich spiele oft nach der Schule Fußball. Was ist dein Lieblingsspiel?'],['Philip','Mein Lieblingsspiel ist Call of Duty. Mit wem spielst du Fußball?'],['Midas','Ich spiele mit meinen Freunden Fußball. Wie oft spielst du Computerspiele?'],['Philip','Fast jeden Tag. Wo spielst du Fußball?'],['Midas','Ich spiele Fußball bei CJVV. Wann spielst du Computerspiele?'],['Philip','Meistens abends. Wer ist dein Lieblingsfußballer?'],['Midas','Mein Lieblingsfußballer ist Sugawara. Mit wem spielst du Computerspiele?'],['Philip','Ich spiele meistens mit meinen Freunden. Was möchtest du werden, wenn du groß bist?'],['Midas','Ich möchte Fußballer werden. Was möchtest du werden, wenn du groß bist?'],['Philip','Ich möchte Programmierer werden.'],['Midas','Danke für das Gespräch. Tschüss.'],['Philip','Danke, tschüss.']];
let role='Philip',mode='learn',items=[],pos=0,correct=0,revealed=false;
const screen=document.querySelector('#screen');
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function distance(a,b){const m=Array(b.length+1).fill(0).map((_,i)=>i);for(let i=1;i<=a.length;i++){let prev=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const old=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return m[b.length]}
function initials(s){return s.split(/\s+/).map(w=>w[0]).join(' · ')}
function say(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.82;speechSynthesis.speak(u)}
function setup(){screen.innerHTML=`<h2>Which part are you learning?</h2><div class="setup"><button class="choice ${role==='Philip'?'active':''}" data-role="Philip">Philip</button><button class="choice ${role==='Midas'?'active':''}" data-role="Midas">Midas</button></div><label>Practice mode</label><div class="mode"><button class="${mode==='learn'?'active':''}" data-mode="learn">Learn in order</button><button class="${mode==='random'?'active':''}" data-mode="random">Random test</button></div><p class="hint">You will see the other person's line. Remember what your character says next, then type it or say it aloud.</p><button class="primary start" id="start">Start practising</button>`;
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;setup()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;setup()});document.querySelector('#start').onclick=start}
function start(){items=dialogue.map((line,i)=>({line,i})).filter(x=>x.line[0]===role);if(mode==='random')items.sort(()=>Math.random()-.5);pos=0;correct=0;revealed=false;render()}
function render(){if(pos>=items.length){finish();return}const item=items[pos],answer=item.line[1],previous=item.i?dialogue[item.i-1]:null;const cue=previous?`${previous[0]}: ${previous[1]}`:'The conversation starts — you speak first.';screen.innerHTML=`<div class="topline"><span class="pill">You are ${role}</span><span class="score">${pos+1} of ${items.length} · ${correct} right</span></div><div class="cue-label">Your cue</div><div class="cue">${esc(cue)}</div><button class="quiet" id="hearCue">🔊 Hear cue</button><div class="your-label" style="margin-top:25px">Your line</div><textarea id="typed" placeholder="Type the German line here — or say it aloud before revealing it" autocomplete="off"></textarea><p class="hint" id="hint">First letters: <strong>${esc(initials(answer))}</strong></p><div class="feedback" id="feedback"></div><div class="answer ${revealed?'show':''}" id="answer"><strong>Exact line:</strong><br>${esc(answer)} <button class="quiet" id="hearAnswer" style="margin-left:8px">🔊</button></div><div class="actions"><button class="primary" id="check">Check my answer</button><button class="secondary" id="reveal">${revealed?'Hide answer':'Reveal answer'}</button><button class="secondary" id="next">Next cue</button></div><div class="footer-actions"><button class="quiet" id="restart">Change role or mode</button></div>`;
document.querySelector('#hearCue').onclick=()=>say(previous?previous[1]:answer);document.querySelector('#check').onclick=check;document.querySelector('#reveal').onclick=()=>{revealed=!revealed;render();document.querySelector('#typed').focus()};document.querySelector('#next').onclick=()=>{pos++;revealed=false;render()};document.querySelector('#restart').onclick=setup;const ha=document.querySelector('#hearAnswer');if(ha)ha.onclick=()=>say(answer);document.querySelector('#typed').focus()}
function check(){const target=items[pos].line[1],typed=document.querySelector('#typed').value;if(!typed.trim()){document.querySelector('#feedback').textContent='Say it aloud first, or type it here to be checked.';return}const a=norm(typed),b=norm(target),ratio=distance(a,b)/Math.max(a.length,b.length,1);const f=document.querySelector('#feedback');if(ratio<=.08){f.textContent='Correct — nice work.';f.className='feedback good';correct++;document.querySelector('#check').disabled=true}else{f.textContent=ratio<=.25?'Very close. Compare it with the exact line.':'Not quite yet. Use the first-letter hint, then reveal the line.';f.className='feedback close'}}
function finish(){screen.innerHTML=`<div class="done"><div class="pill">Round complete</div><h2>${correct} of ${items.length} typed correctly</h2><p>Do another round in random mode. When that feels easy, rehearse the full conversation with your friend and use only the other person's line as your cue.</p><div class="actions"><button class="primary" id="again">Practise again</button><button class="secondary" id="settings">Change settings</button></div></div>`;document.querySelector('#again').onclick=start;document.querySelector('#settings').onclick=setup}
setup();
</script>
</body>
</html>
